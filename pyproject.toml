[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "puriphage"
version = "0.1.0"
description = "Pipeline for phage assembly and purity evaluation"
requires-python = ">=3.12"

[project.scripts]
PuriPhage = "puriphage.cli:main"

[tool.setuptools]
packages = ["puriphage"]
